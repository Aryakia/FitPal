name: Deploy FitPal to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out FitPal
        uses: actions/checkout@v4
      - name: Validate the static website
        run: |
          test -s index.html
          test -s assets/app.js
          test -s assets/styles.css
          test -f config.js
          grep -q 'assets/app.js' index.html
          grep -q 'assets/styles.css' index.html
      - name: Prepare static site
        run: |
          mkdir -p _site/assets
          cp index.html config.js _site/
          cp assets/app.js assets/styles.css _site/assets/
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy FitPal
        id: deployment
        uses: actions/deploy-pages@v4
